name: CI

on:
  pull_request:
    branches: [master]

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "20"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l . | grep -v vendor || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Code not formatted. Run 'gofmt -w .'"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Install and run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          golangci-lint run --timeout=5m ./cmd/... ./internal/... ./pkg/...

      - name: Summary
        if: always()
        run: |
          echo "## 🔍 Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ All checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Lint checks failed" >> $GITHUB_STEP_SUMMARY
          fi

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./cmd/... ./internal/... ./pkg/... 2>&1 | tee test-output.txt
          echo "TEST_EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false

      - name: Summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Extract test stats
          PASSED=$(grep -c "^--- PASS" test-output.txt 2>/dev/null || echo "0")
          FAILED=$(grep -c "^--- FAIL" test-output.txt 2>/dev/null || echo "0")

          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY

          # Show coverage if available
          if [ -f coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
            echo "| 📊 Coverage | $COVERAGE |" >> $GITHUB_STEP_SUMMARY
          fi

  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build packages
        run: go build ./cmd/... ./internal/... ./pkg/...

      - name: Build server
        run: |
          go build -ldflags="-s -w" -o bin/server ./cmd/server
          ls -lh bin/server

      - name: Summary
        run: |
          echo "## 🔨 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Binary | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          SIZE=$(ls -lh bin/server | awk '{print $5}')
          echo "| server | $SIZE |" >> $GITHUB_STEP_SUMMARY

  security:
    name: 🔒 Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./cmd/... ./internal/... ./pkg/... 2>&1 | tee vuln-output.txt || true

      - name: Summary
        run: |
          echo "## 🔒 Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if grep -q "No vulnerabilities found" vuln-output.txt; then
            echo "✅ No vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Review vulnerability report in logs" >> $GITHUB_STEP_SUMMARY
          fi

  api-test:
    name: 🌐 API Test (Bruno)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Initialize Database (Migrations & Seeds)
        # Read database config from configs/local.example.yml and run initialization script
        run: |
          DB_HOST=$(yq '.database.host' configs/local.example.yml)
          DB_PORT=$(yq '.database.port' configs/local.example.yml)
          DB_USER=$(yq '.database.user' configs/local.example.yml)
          DB_PASS=$(yq '.database.password' configs/local.example.yml)
          DB_NAME=$(yq '.database.dbname' configs/local.example.yml)
          
          PGPASSWORD="$DB_PASS" PGHOST="$DB_HOST" PGPORT="$DB_PORT" POSTGRES_USER="$DB_USER" POSTGRES_DB="$DB_NAME" \
            sed 's|/docker-entrypoint-initdb.d|database|g' database/init-db.sh | bash

      - name: Build and start server
        run: |
          go build -o bin/server ./cmd/server
          CONFIG_PATH=configs/local.example.yml ./bin/server &

      # Wait for server
      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:10101/health > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run API tests
        id: bruno
        run: |
          cd tests/bruno
          bru run --env memory 2>&1 | tee bruno-output.txt
          echo "BRUNO_EXIT=$?" >> $GITHUB_ENV

      - name: Stop server
        if: always()
        run: pkill -f "bin/server" || true

      - name: Summary
        if: always()
        run: |
          echo "## 🌐 Bruno API Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f tests/bruno/bruno-output.txt ]; then
            # Count results
            TOTAL=$(grep -c "Request:" tests/bruno/bruno-output.txt 2>/dev/null || echo "0")
            PASSED=$(grep -c "✓" tests/bruno/bruno-output.txt 2>/dev/null || echo "0")
            FAILED=$(grep -c "✗" tests/bruno/bruno-output.txt 2>/dev/null || echo "0")
            
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 📋 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "<details><summary>📝 Full Output</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat tests/bruno/bruno-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No test output found" >> $GITHUB_STEP_SUMMARY
          fi

  web:
    name: 🎨 Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Summary
        run: |
          echo "## 🎨 Web UI Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "frontend/dist" ]; then
            SIZE=$(du -sh frontend/dist | cut -f1)
            echo "✅ Build successful ($SIZE)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY
          fi

  # Final summary
  summary:
    name: 📊 Summary
    needs: [lint, test, build, security, api-test, web]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## 📊 CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Lint | ${{ needs.lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Test | ${{ needs.test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔨 Build | ${{ needs.build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security | ${{ needs.security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 API Test | ${{ needs.api-test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎨 Web UI | ${{ needs.web.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
