environment: local

server:
  port: 10101

# Portal: JWT auth + workspace API; UI + message inbox (memory preview).
# Override JWT with MESSAGE_JWT_SECRET.
portal:
  jwt_secret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  jwt_ttl_hours: 72
  ui_enabled: true
  ui_port: 10104

# Mailpit Integration (optional)
# To use Mailpit, start it with: make mailpit

providers:
  defaults:
    email: memory
    sms: memory
    push: memory
    chat: memory
    otp: memory
  
  # Provider configurations
  email:
    memory: {}
    # mailgun:
    #   api_key: "key-1234567890"
    #   domain: "mg.example.com"
    #   from_email: "no-reply@mg.example.com"
    #   base_url: "https://api.eu.mailgun.net" # Optional, defaults to US

  sms:
    memory: {}
    # twilio:
    #   account_sid: "AC..."
    #   auth_token: "..."
    #   from_number: "+15550000000"

  push:
    memory: {}
    # fcm:
    #   service_account_file: "path/to/service-account.json"
    #   project_id: "my-project-id"

  chat:
    memory: {}
