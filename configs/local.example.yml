# ============================================================================
# WPD Message Gateway — Server Configuration
# ============================================================================
#
# Copy this file to `local.yml` and customize as needed:
#   cp configs/local.example.yml configs/local.yml
#
# IMPORTANT: This file configures the SERVER (ports, JWT, optional features).
# Provider credentials (Mailgun API keys, etc.) are NOT stored here.
# They are configured via the Portal REST API and stored AES-encrypted in PostgreSQL.
#
# For the embedded Go SDK (gateway.New()), pass config directly in code.
# See: docs/backend/usage.md
#
# ============================================================================

environment: local

# ----------------------------------------------------------------------------
# Server Configuration
# ----------------------------------------------------------------------------
server:
  port: 10101 # Gateway send API + Portal REST API

# ----------------------------------------------------------------------------
# Portal (React UI + JWT auth)
# ----------------------------------------------------------------------------
portal:
  # Secret for signing portal JWTs. Must be at least 32 chars.
  # Override with: MESSAGE_JWT_SECRET=<secret>
  jwt_secret: "REPLACE_JWT_SECRET"
  jwt_ttl_hours: 72
  ui_port: 10104

  # Base URL of the portal UI (optional, defaults to https://message-gateway.weprodev.com)
  # Override with: MESSAGE_PORTAL_BASE_URL=<url>
  base_url: "https://message-gateway.weprodev.com"

# Database configuration (used if environment variables are not set)
database:
  host: localhost
  port: 5432
  user: gateway
  password: yourpassword
  dbname: gateway
  sslmode: disable

# ============================================================================
# Environment Variable Overrides
# ============================================================================
#
# Database connection (required for server mode):
#   DATABASE_URL=postgres://user:pass@localhost:5432/gateway?sslmode=disable
#
# Or individual components:
#   DB_HOST=localhost
#   DB_PORT=5432
#   DB_USER=gateway
#   DB_PASSWORD=yourpassword
#   DB_NAME=gateway
#
# JWT secret:
#   MESSAGE_JWT_SECRET=your-long-secret-here
#
# AES encryption key for provider credentials (32 bytes):
#   MESSAGE_CONFIG_ENCRYPTION_KEY=your-32-byte-key-here0123456789ab
#
# Internal ingest secret (required in production; for automation workers only):
#   MESSAGE_INTERNAL_INGEST_SECRET=your-ingest-secret
#
# Local dev only — allow internal ingest without a secret (never use in production):
#   MESSAGE_INTERNAL_INGEST_ALLOW_OPEN=true
#
# Portal UI Base URL for email verification links:
#   MESSAGE_PORTAL_BASE_URL=https://inbox.weprodev.com
#
# ============================================================================

# ----------------------------------------------------------------------------
# Providers Configuration
# ----------------------------------------------------------------------------
providers:
  defaults:
    email: "memory"
    sms: "memory"
    push: "memory"
    chat: "memory"

